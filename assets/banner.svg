<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Rishav Chakravarty — Data Analytics and Computational Social Science">
  <title>Rishav Chakravarty — Data Analytics &amp; Computational Social Science</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="50%" stop-color="#0F1C2E"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#134E4A"/>
      <stop offset="60%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="glowSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2DD4BF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panel"><rect x="1" y="1" width="998" height="298" rx="22"/></clipPath>
  </defs>

  <!-- panel -->
  <rect x="1" y="1" width="998" height="298" rx="22" fill="url(#bg)" stroke="#1E2A3A" stroke-width="1.5"/>

  <g clip-path="url(#panel)">
    <!-- ambient glow blobs -->
    <circle cx="880" cy="30" r="150" fill="#2DD4BF" opacity="0.07">
      <animate attributeName="opacity" values="0.05;0.11;0.05" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="290" r="130" fill="#FBBF24" opacity="0.05">
      <animate attributeName="opacity" values="0.03;0.08;0.03" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- faint dot matrix texture -->
    <g fill="#2DD4BF" opacity="0.10">
      <circle cx="540" cy="40" r="1.6"/><circle cx="580" cy="70" r="1.6"/><circle cx="520" cy="110" r="1.6"/>
      <circle cx="960" cy="200" r="1.6"/><circle cx="930" cy="255" r="1.6"/><circle cx="620" cy="275" r="1.6"/>
      <circle cx="470" cy="60" r="1.6"/><circle cx="700" cy="35" r="1.6"/>
    </g>

    <!-- sweeping light across the top edge -->
    <rect x="-400" y="1" width="400" height="3" fill="url(#glowSweep)">
      <animate attributeName="x" values="-400;1000" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- ============ LEFT: identity ============ -->
    <text x="56" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="3.4" fill="#2DD4BF">
      DATA ANALYTICS · COMPUTATIONAL SOCIAL SCIENCE
    </text>

    <text x="56" y="134" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#E6EDF3">
      Rishav Chakravarty
    </text>

    <rect x="56" y="150" width="0" height="4" rx="2" fill="url(#accent)">
      <animate attributeName="width" values="0;196" dur="1.1s" begin="0.2s" fill="freeze"/>
    </rect>

    <text x="56" y="188" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#93A4B8">
      M.S. Data Analytics &amp; Computational Social Science
    </text>
    <text x="56" y="211" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#64748B">
      UMass Amherst · Amherst, MA
    </text>

    <!-- chips -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
      <g opacity="0">
        <rect x="56" y="232" width="140" height="30" rx="15" fill="#0F2A2A" stroke="#2DD4BF" stroke-opacity="0.45"/>
        <text x="126" y="251.5" text-anchor="middle" fill="#5EEAD4">Python · R · SQL</text>
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.9s" fill="freeze"/>
      </g>
      <g opacity="0">
        <rect x="206" y="232" width="186" height="30" rx="15" fill="#12233A" stroke="#38BDF8" stroke-opacity="0.45"/>
        <text x="299" y="251.5" text-anchor="middle" fill="#7DD3FC">ML · Causal Inference</text>
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.15s" fill="freeze"/>
      </g>
      <g opacity="0">
        <rect x="402" y="232" width="140" height="30" rx="15" fill="#2A2110" stroke="#FBBF24" stroke-opacity="0.45"/>
        <text x="472" y="251.5" text-anchor="middle" fill="#FCD34D">Flutter · React</text>
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.4s" fill="freeze"/>
      </g>
    </g>

    <!-- ============ RIGHT: live chart ============ -->
    <g>
      <!-- gridlines -->
      <g stroke="#1E2A3A" stroke-width="1">
        <line x1="600" y1="250" x2="920" y2="250"/>
        <line x1="600" y1="205" x2="920" y2="205"/>
        <line x1="600" y1="160" x2="920" y2="160"/>
        <line x1="600" y1="115" x2="920" y2="115"/>
        <line x1="600" y1="70"  x2="920" y2="70"/>
      </g>
      <line x1="600" y1="60" x2="600" y2="250" stroke="#243449" stroke-width="1.5"/>

      <!-- bars -->
      <g>
        <rect x="620" y="250" width="26" height="0" rx="5" fill="url(#barGrad)" opacity="0.9">
          <animate attributeName="height" values="0;60" dur="1.0s" begin="0.15s" fill="freeze"/>
          <animate attributeName="y" values="250;190" dur="1.0s" begin="0.15s" fill="freeze"/>
        </rect>
        <rect x="660" y="250" width="26" height="0" rx="5" fill="url(#barGrad)" opacity="0.9">
          <animate attributeName="height" values="0;95" dur="1.0s" begin="0.27s" fill="freeze"/>
          <animate attributeName="y" values="250;155" dur="1.0s" begin="0.27s" fill="freeze"/>
        </rect>
        <rect x="700" y="250" width="26" height="0" rx="5" fill="url(#barGrad)" opacity="0.9">
          <animate attributeName="height" values="0;72" dur="1.0s" begin="0.39s" fill="freeze"/>
          <animate attributeName="y" values="250;178" dur="1.0s" begin="0.39s" fill="freeze"/>
        </rect>
        <rect x="740" y="250" width="26" height="0" rx="5" fill="url(#barGrad)" opacity="0.9">
          <animate attributeName="height" values="0;130" dur="1.0s" begin="0.51s" fill="freeze"/>
          <animate attributeName="y" values="250;120" dur="1.0s" begin="0.51s" fill="freeze"/>
        </rect>
        <rect x="780" y="250" width="26" height="0" rx="5" fill="url(#barGrad)" opacity="0.9">
          <animate attributeName="height" values="0;108" dur="1.0s" begin="0.63s" fill="freeze"/>
          <animate attributeName="y" values="250;142" dur="1.0s" begin="0.63s" fill="freeze"/>
        </rect>
        <rect x="820" y="250" width="26" height="0" rx="5" fill="url(#barGrad)">
          <animate attributeName="height" values="0;165" dur="1.0s" begin="0.75s" fill="freeze"/>
          <animate attributeName="y" values="250;85" dur="1.0s" begin="0.75s" fill="freeze"/>
        </rect>
        <rect x="860" y="250" width="26" height="0" rx="5" fill="url(#barGrad)" opacity="0.9">
          <animate attributeName="height" values="0;140" dur="1.0s" begin="0.87s" fill="freeze"/>
          <animate attributeName="y" values="250;110" dur="1.0s" begin="0.87s" fill="freeze"/>
        </rect>
      </g>

      <!-- trend line -->
      <polyline points="633,190 673,155 713,178 753,120 793,142 833,85 873,110"
                fill="none" stroke="#FBBF24" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"
                stroke-dasharray="420" stroke-dashoffset="420">
        <animate attributeName="stroke-dashoffset" values="420;0" dur="1.6s" begin="1.0s" fill="freeze"/>
      </polyline>

      <g fill="#0B1220" stroke="#FBBF24" stroke-width="2.2" opacity="0">
        <circle cx="633" cy="190" r="4"/><circle cx="673" cy="155" r="4"/><circle cx="713" cy="178" r="4"/>
        <circle cx="753" cy="120" r="4"/><circle cx="793" cy="142" r="4"/><circle cx="873" cy="110" r="4"/>
        <animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.4s" fill="freeze"/>
      </g>

      <!-- peak marker -->
      <g opacity="0">
        <circle cx="833" cy="85" r="6" fill="#FBBF24"/>
        <circle cx="833" cy="85" r="6" fill="none" stroke="#FBBF24" stroke-width="2">
          <animate attributeName="r" values="6;18" dur="2.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.9;0" dur="2.2s" repeatCount="indefinite"/>
        </circle>
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.6s" fill="freeze"/>
      </g>

      <text x="600" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#3E5570">
        SIGNAL &gt; NOISE
      </text>
    </g>
  </g>
</svg>
